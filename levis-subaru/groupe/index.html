<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Groupe Couture · Plateforme</title><style>:root{font-family:Segoe UI,Arial,sans-serif;color:#183b56;background:#f3f6f8}body{margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:480px;margin:24px;padding:32px;border:1px solid #dce5eb;border-radius:14px;background:white}p{line-height:1.65}button{font:inherit;border:0;border-radius:8px;padding:12px 18px;background:#183b56;color:white;cursor:pointer}a{color:#087c72}[hidden]{display:none!important}</style></head><body><main><img src="../branding/logos/groupe-couture.webp" width="240" height="125" style="object-fit:contain;max-width:100%" alt="Groupe Couture"><p>GROUPE COUTURE</p><h1>Plateforme du groupe</h1><p id="status" role="status">Chargement de la version publiée…</p><button id="retry" hidden>Réessayer</button><noscript><p>Activez JavaScript pour ouvrir la plateforme.</p></noscript></main><script>
async function openPlatform(){const status=document.querySelector('#status'),retry=document.querySelector('#retry');retry.hidden=true;status.textContent='Chargement de la version publiée…';try{const response=await fetch('./release.json',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error();const release=await response.json();if(!/^\d+\.\d+\.\d+$/.test(release.version)||release.entry!=='app-'+release.version+'.html')throw Error();const current=new URL(location.href),target=new URL(release.entry,current);target.search=current.search;target.searchParams.set('v',release.version);target.hash=current.hash;location.replace(target.href);}catch{status.textContent='Le chargement de la plateforme n’a pas abouti. Vérifiez votre connexion, puis réessayez.';retry.hidden=false;}}document.querySelector('#retry').onclick=openPlatform;openPlatform();
</script></body></html>
